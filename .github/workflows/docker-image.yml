name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: |
        nginx_version=$(sed -n 's/^nginx_mainline=//p' supported_versions)
        alpine_version=$(sed -n 's/^alpine=//p' supported_versions)
        dockerfile="nginx/${nginx_version}/alpine/${alpine_version}/Dockerfile"
        docker build --file "$dockerfile" --tag my-image-name:$(date +%s) "$(dirname "$dockerfile")"
